<!DOCTYPE html>
<html>
<head>
    <title>Incident Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Incident Tracker</h1>

    <div class="form-container">
        <h2>Create Incident</h2>

        <input type="text" id="title" placeholder="Title">
        <input type="text" id="description" placeholder="Description">
        <input type="text" id="status" placeholder="Status (OPEN/CLOSED)">
        <input type="text" id="severity" placeholder="Severity (HIGH/LOW)">
        <input type="text" id="owner" placeholder="Owner">
        <input type="text" id="service" placeholder="Service">

        <button onclick="createIncident()">Create</button>
    </div>

    <hr>

    <h2>All Incidents</h2>
    <button onclick="loadIncidents()">Refresh</button>

    <div id="incidentList"></div>

    <script src="script.js"></script>
</body>
</html>
